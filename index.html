<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Nervioso Central - Anatomía Real</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 12px; right: 12px; left: 12px;
      background: rgba(10, 15, 25, 0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 14px; box-shadow: 0 4px 25px rgba(0, 243, 255, 0.15); z-index: 10;
    }
    h3 { margin: 0 0 4px 0; color: #00f3ff; font-size: 1rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.8rem; line-height: 1.35; color: #cbd5e1; }
    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #030508; display: flex; justify-content: center; align-items: center;
      flex-direction: column; z-index: 100; color: #00f3ff; font-weight: 600;
    }
    .spinner {
      border: 3px solid rgba(0, 243, 255, 0.1); width: 36px; height: 36px;
      border-radius: 50%; border-left-color: #00f3ff; animation: spin 1s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .controls-hint {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(5, 8, 15, 0.8); padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 0.72rem; color: #94a3b8; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="load-status">Conectando con el servidor 3D...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central (Anatomía Real)</h3>
    <p id="desc">Estructura tridimensional detallada. Toca y arrastra para explorar la maqueta desde cualquier ángulo.</p>
  </div>

  <div class="controls-hint">Rotar: Arrastrar | Zoom: Pellizcar pantalla</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación clínica de estudio avanzado
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
    keyLight.position.set(5, 10, 7);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 1.0);
    rimLight.position.set(-6, 5, -5);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xff477e, 0.4);
    fillLight.position.set(0, -8, 4);
    scene.add(fillLight);

    let brainModel = null;
    const loader = new THREE.GLTFLoader();

    // Enlace optimizado mediante CDN público libre de bloqueos CORS
    const brainUrl = 'https://cdn.jsdelivr.net/gh/baronwatts/threejs-brain@master/brain.glb';

    loader.load(
      brainUrl,
      function (gltf) {
        brainModel = gltf.scene;

        // Centrado y escala automática
        const box = new THREE.Box3().setFromObject(brainModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        brainModel.position.x -= center.x;
        brainModel.position.y -= center.y;
        brainModel.position.z -= center.z;

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.8 / maxDim;
        brainModel.scale.set(scale, scale, scale);

        // Aplicar material clínico con relieve y definición anatómica
        brainModel.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0xdb5870,
              roughness: 0.35,
              metalness: 0.15
            });
          }
        });

        scene.add(brainModel);
        document.getElementById('loading-screen').style.display = 'none';
      },
      function (xhr) {
        if (xhr.total > 0) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('load-status').innerText = `Descargando modelo real... ${percent}%`;
        }
      },
      function (error) {
        console.error(error);
        document.getElementById('load-status').innerText = 'Error al cargar el archivo 3D.';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
