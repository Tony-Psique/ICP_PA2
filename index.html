<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Digital: Sistema Nervioso Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0b0e14; font-family: sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 15px; right: 15px; width: 280px;
      background: rgba(18, 24, 38, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 10px;
      padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h3 { margin: 0 0 8px 0; color: #00d2ff; font-size: 1.1rem; }
    p { margin: 0; font-size: 0.85rem; line-height: 1.4; color: #d1d5db; }
    .controls-hint {
      position: absolute; bottom: 15px; left: 15px;
      background: rgba(0,0,0,0.7); padding: 8px 12px;
      border-radius: 6px; font-size: 0.75rem; color: #9ca3af;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central</h3>
    <p id="desc">Haz clic o toca una estructura (Cerebro, Cerebelo, Tallo o Médula) para resaltar y consultar sus funciones.</p>
  </div>

  <div class="controls-hint">
    Rotar: Clic/Tocar y arrastrar | Zoom: Rueda / Pellizco
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0e14);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
    light1.position.set(5, 10, 7);
    scene.add(light1);

    const light2 = new THREE.DirectionalLight(0x00d2ff, 0.4);
    light2.position.set(-5, -5, -5);
    scene.add(light2);

    const sncGroup = new THREE.Group();

    const createMat = (color) => new THREE.MeshPhongMaterial({ color, roughness: 0.3, shininess: 40 });
    
    // 1. CEREBRO
    const brainGeo = new THREE.SphereGeometry(1.4, 32, 32);
    brainGeo.scale(1.2, 0.95, 1.1);
    const cerebrum = new THREE.Mesh(brainGeo, createMat(0xff7597));
    cerebrum.position.set(0, 2.2, 0);
    cerebrum.userData = {
      name: "Cerebro (Hemisferios)",
      desc: "Procesa información sensorial, controla movimientos voluntarios, el pensamiento consciente, la memoria y la toma de decisiones."
    };
    sncGroup.add(cerebrum);

    // 2. CEREBELO
    const cerebellumGeo = new THREE.SphereGeometry(0.7, 32, 32);
    cerebellumGeo.scale(1.1, 0.75, 0.85);
    const cerebellum = new THREE.Mesh(cerebellumGeo, createMat(0xff9f43));
    cerebellum.position.set(0, 1.1, -0.75);
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Ubicado en la parte posterior inferior. Regula el equilibrio, la postura corporal y la coordinación fina de los movimientos."
    };
    sncGroup.add(cerebellum);

    // 3. TALLO CEREBRAL
    const stemGeo = new THREE.CylinderGeometry(0.38, 0.28, 1.2, 32);
    const brainStem = new THREE.Mesh(stemGeo, createMat(0x00d2ff));
    brainStem.position.set(0, 1.2, -0.1);
    brainStem.userData = {
      name: "Tallo Cerebral (Tronco Encefálico)",
      desc: "Conecta el encéfalo con la médula espinal. Regula funciones vitales involuntarias como el ritmo cardíaco, la respiración y la presión arterial."
    };
    sncGroup.add(brainStem);

    // 4. MÉDULA ESPINAL
    const cordGeo = new THREE.CylinderGeometry(0.22, 0.18, 4.2, 32);
    const spinalCord = new THREE.Mesh(cordGeo, createMat(0x10ac84));
    spinalCord.position.set(0, -1.5, -0.1);
    spinalCord.userData = {
      name: "Médula Espinal",
      desc: "Cordón nervioso protegido por la columna vertebral. Conduce los impulsos sensitivos hacia el encéfalo y las respuestas motoras hacia el cuerpo."
    };
    sncGroup.add(spinalCord);

    scene.add(sncGroup);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerWidth) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sncGroup.children);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        document.getElementById('title').innerText = obj.userData.name;
        document.getElementById('desc').innerText = obj.userData.desc;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
