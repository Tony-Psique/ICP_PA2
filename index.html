<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Nervioso Central - Anatomía Exacta</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 12px; right: 12px; left: 12px;
      background: rgba(10, 15, 25, 0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 14px; box-shadow: 0 4px 25px rgba(0, 243, 255, 0.15); z-index: 10;
    }
    h3 { margin: 0 0 4px 0; color: #00f3ff; font-size: 1rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.8rem; line-height: 1.35; color: #cbd5e1; }
    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #030508; display: flex; justify-content: center; align-items: center;
      flex-direction: column; z-index: 100; color: #00f3ff; font-weight: 600;
    }
    .spinner {
      border: 3px solid rgba(0, 243, 255, 0.1); width: 36px; height: 36px;
      border-radius: 50%; border-left-color: #00f3ff; animation: spin 1s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .controls-hint {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(5, 8, 15, 0.8); padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 0.72rem; color: #94a3b8; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="load-status">Cargando modelo anatómico 3D...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central</h3>
    <p id="desc">Modelo anatómico tridimensional de alta precisión. Toca o arrastra para rotar la maqueta.</p>
  </div>

  <div class="controls-hint">Rotar: Arrastrar | Zoom: Pellizcar pantalla</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Iluminación médica
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(5, 10, 7);
    scene.add(mainLight);

    const loader = new THREE.GLTFLoader();

    // Enlace directo al modelo 3D real alojado en repositorio público de modelos Three.js
    const modelUrl = 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb'; 

    // Usaremos un modelo 3D de alta precisión anatómica del cerebro cargado desde CDN
    const brainUrl = 'https://cdn.jsdelivr.net/gh/baronwatts/threejs-brain@master/brain.glb';

    loader.load(
      brainUrl,
      function (gltf) {
        const model = gltf.scene;

        // Centrado y escala de la estructura real
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.x -= center.x;
        model.position.y -= center.y;
        model.position.z -= center.z;

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.8 / maxDim;
        model.scale.set(scale, scale, scale);

        scene.add(model);
        document.getElementById('loading-screen').style.display = 'none';
      },
      function (xhr) {
        if (xhr.total > 0) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('load-status').innerText = `Cargando anatomía real... ${percent}%`;
        }
      },
      function (error) {
        document.getElementById('load-status').innerText = 'Error al cargar el archivo 3D.';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
