<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Clínica: Sistema Nervioso Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 15px; right: 15px; width: 290px;
      background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 16px; box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15);
    }
    h3 { margin: 0 0 8px 0; color: #00f3ff; font-size: 1.15rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }
    .controls-hint {
      position: absolute; bottom: 15px; left: 15px;
      background: rgba(5, 8, 15, 0.75); backdrop-filter: blur(6px);
      padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 0.75rem; color: #94a3b8;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central</h3>
    <p id="desc">Toca cualquier estructura anatómica para aislar su función clínica y fisiológica.</p>
  </div>

  <div class="controls-hint">
    Rotar: Tocar y arrastrar | Zoom: Pellizcar pantalla
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.035);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 1.7;

    // Iluminación clínica avanzada
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x00f3ff, 1.2);
    dirLight1.position.set(6, 12, 8);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xff007f, 0.8);
    dirLight2.position.set(-6, -6, -6);
    scene.add(dirLight2);

    const sncGroup = new THREE.Group();

    // Material translúcido estilo bio-holograma
    const createBioMat = (colorHex) => new THREE.MeshPhysicalMaterial({
      color: colorHex,
      roughness: 0.2,
      metalness: 0.1,
      transmission: 0.3,
      transparent: true,
      opacity: 0.92,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      wireframe: false
    });

    // 1. CEREBRO (Estructura multilobular simulada más orgánica)
    const cerebrumGeo = new THREE.SphereGeometry(1.3, 32, 32);
    cerebrumGeo.scale(1.2, 0.88, 1.25);
    const cerebrum = new THREE.Mesh(cerebrumGeo, createBioMat(0xff477e));
    cerebrum.position.set(0, 1.3, 0);
    cerebrum.userData = {
      name: "Cerebro (Hemisferios)",
      desc: "Centro integrador superior. Gestiona funciones cognitivas superiores, procesamiento sensorial y la ordenación de la motricidad voluntaria."
    };
    sncGroup.add(cerebrum);

    // 2. CEREBELO (Forma laminar posterior comprimida)
    const cerebellumGeo = new THREE.SphereGeometry(0.6, 32, 32);
    cerebellumGeo.scale(1.4, 0.65, 0.85);
    const cerebellum = new THREE.Mesh(cerebellumGeo, createBioMat(0xffa502));
    cerebellum.position.set(0, 0.5, -0.75);
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Estructura subcortical especializada en la integración somatosensorial, regulación del tono postural y coordinación de movimientos finos."
    };
    sncGroup.add(cerebellum);

    // 3. TALLO CEREBRAL (Tronco encefálico anatómicamente conectado)
    const stemGeo = new THREE.CylinderGeometry(0.32, 0.22, 1.2, 32);
    const brainStem = new THREE.Mesh(stemGeo, createBioMat(0x00d2d3));
    brainStem.position.set(0, 0.3, -0.15);
    brainStem.rotation.x = 0.1;
    brainStem.userData = {
      name: "Tallo Cerebral",
      desc: "Compuesto por mesencéfalo, puente y bulbo raquídeo. Aloja centros autónomos vitales para la respiración, frecuencia cardiaca y ciclos de vigilia."
    };
    sncGroup.add(brainStem);

    // 4. MÉDULA ESPINAL (Trayecto descendente segmentado)
    const cordGeo = new THREE.CylinderGeometry(0.14, 0.11, 3.8, 32);
    const spinalCord = new THREE.Mesh(cordGeo, createBioMat(0x2ed573));
    spinalCord.position.set(0, -1.8, -0.25);
    spinalCord.userData = {
      name: "Médula Espinal",
      desc: "Vía de conducción bidireccional de fascículos ascendentes (sensitivos) y descendentes (motores), además de integrar arcos reflejos medulares."
    };
    sncGroup.add(spinalCord);

    scene.add(sncGroup);

    // Sistema de interacción táctil (Raycaster)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sncGroup.children);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        document.getElementById('title').innerText = obj.userData.name;
        document.getElementById('desc').innerText = obj.userData.desc;
        
        // Efecto visual sutil de selección en escala
        sncGroup.children.forEach(child => child.scale.set(1, 1, 1));
        obj.scale.set(1.08, 1.08, 1.08);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
