<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Nervioso Central - Anatomía Exacta 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #020305; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 12px; right: 12px; left: 12px;
      background: rgba(8, 11, 18, 0.94); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.35); border-radius: 12px;
      padding: 14px; box-shadow: 0 4px 25px rgba(0, 243, 255, 0.15); z-index: 10;
    }
    h3 { margin: 0 0 4px 0; color: #00f3ff; font-size: 0.95rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.78rem; line-height: 1.35; color: #cbd5e1; }
    .controls-hint {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(5, 8, 15, 0.85); padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
      font-size: 0.7rem; color: #94a3b8; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central (Fidelidad Anatómica 3D)</h3>
    <p id="desc">Toca o desliza en cualquier parte para identificar las estructuras y consultar su relevancia médica.</p>
  </div>

  <div class="controls-hint">Rotar: Arrastrar | Zoom: Pellizcar pantalla</div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020305);
    scene.fog = new THREE.FogExp2(0x020305, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación para resaltar textura y rugosidad tridimensional
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const kLight = new THREE.DirectionalLight(0xffffff, 1.0);
    kLight.position.set(5, 8, 6);
    scene.add(kLight);

    const rLight = new THREE.DirectionalLight(0x00f3ff, 0.8);
    rLight.position.set(-6, 3, -4);
    scene.add(rLight);

    const fillLight = new THREE.DirectionalLight(0xff477e, 0.35);
    fillLight.position.set(0, -5, 3);
    scene.add(fillLight);

    const sncGroup = new THREE.Group();

    // Material sombreado realista, con textura orgánica, relieve (shininess) y translucidez (MeshStandardMaterial)
    const getMaterial = (color) => new THREE.MeshStandardMaterial({
      color: color,
      roughness: 0.65,
      metalness: 0.1,
      bumpScale: 0.05
    });

    // 1. CEREBRO ANATÓMICO (Alta Densidad, pliegues corticales complejos e hendiduras realistas)
    const brainGeo = new THREE.SphereGeometry(1.2, 80, 80);
    brainGeo.scale(1.15, 0.88, 1.35); // Proporción exacta en los tres ejes

    const bPos = brainGeo.attributes.position;
    for (let i = 0; i < bPos.count; i++) {
      let x = bPos.getX(i);
      let y = bPos.getY(i);
      let z = bPos.getZ(i);

      // Fisura interhemisférica (Hendidura que separa los hemisferios)
      if (Math.abs(x) < 0.2 && y > -0.15) {
        x *= 0.35;
      }

      // Algoritmo de generación de circunvoluciones (gyri) y surcos corticales complejos (sulci)
      const gyrus = Math.sin(x * 12) * Math.cos(y * 14) * Math.sin(z * 11);
      const subGyrus = Math.sin(x * 24 + z * 24) * Math.cos(y * 24) * 0.28;
      
      const factor = 1 + (gyrus * 0.045) + (subGyrus * 0.015);

      bPos.setXYZ(i, x * factor, y * factor, z * factor);
    }
    brainGeo.computeVertexNormals();

    const cerebrum = new THREE.Mesh(brainGeo, getMaterial(0xeb4d4b));
    cerebrum.position.set(0, 1.15, 0);
    cerebrum.userData = {
      name: "Cerebro (Hemisferios y Lóbulos)",
      desc: "Presenta surcos y circunvoluciones complejas. Integra funciones cognitivas, sensoriales, la memoria, el lenguaje y los movimientos voluntarios."
    };
    sncGroup.add(cerebrum);

    // 2. CEREBELO (Con estrías horizontales naturales y forma aplanada)
    const cbGeo = new THREE.SphereGeometry(0.55, 48, 48);
    cbGeo.scale(1.35, 0.58, 0.82);

    const cbPos = cbGeo.attributes.position;
    for (let i = 0; i < cbPos.count; i++) {
      let x = cbPos.getX(i);
      let y = cbPos.getY(i);
      let z = cbPos.getZ(i);

      // Foliación horizontal característica (Pliegues muy finos horizontales)
      const folia = Math.sin(y * 42) * 0.022;
      cbPos.setXYZ(i, x * (1 + folia), y * (1 + folia), z * (1 + folia));
    }
    cbGeo.computeVertexNormals();

    const cerebellum = new THREE.Mesh(cbGeo, getMaterial(0xf0932b));
    cerebellum.position.set(0, 0.24, -0.65); // Ajuste de posición posterior, encajado bajo el lóbulo occipital
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Situado en la fosa posterior. Regula la coordinación, la precisión motora fina, el equilibrio y la postura corporal."
    };
    sncGroup.add(cerebellum);

    // 3. TALLO CEREBRAL (Mesencéfalo, Puente de Varolio y Bulbo Raquídeo)
    const stemGroup = new THREE.Group();
    const stemMat = getMaterial(0x00a8ff);

    // Protuberancia (Puente de Varolio, con su abultamiento anterior anatómico)
    const ponsGeo = new THREE.SphereGeometry(0.32, 32, 32);
    ponsGeo.scale(0.85, 0.7, 0.9);
    const pons = new THREE.Mesh(ponsGeo, stemMat);
    pons.position.set(0, 0.28, -0.1);
    stemGroup.add(pons);

    // Tallo (Mesencéfalo superior y bulbo raquídeo inferior conectando a médula)
    const bulkGeo = new THREE.CylinderGeometry(0.24, 0.17, 1.0, 32);
    const bulk = new THREE.Mesh(bulkGeo, stemMat);
    bulk.position.set(0, 0.02, -0.15);
    bulk.rotation.x = 0.06;
    stemGroup.add(bulk);

    stemGroup.userData = {
      name: "Tallo Cerebral (Tronco Encefálico)",
      desc: "Conecta el cerebro con la médula espinal. Aloja centros vitales que controlan la respiración, la presión arterial y el ritmo cardíaco."
    };
    sncGroup.add(stemGroup);

    // 4. MÉDULA ESPINAL (Largo, continuo y alineado inferiormente)
    const cordGeo = new THREE.CylinderGeometry(0.12, 0.09, 3.2, 32);
    const cord = new THREE.Mesh(cordGeo, getMaterial(0x2ed573));
    cord.position.set(0, -1.65, -0.17);
    cord.userData = {
      name: "Médula Espinal",
      desc: "Cordón nervioso continuo que desciende por el canal vertebral. Conduce información sensitiva hacia el encéfalo e impulsos motores hacia el cuerpo."
    };
    sncGroup.add(cord);

    scene.add(sncGroup);

    // Interacción táctil
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(sncGroup.children, true);
      if (intersects.length > 0) {
        let rootObj = intersects[0].object;
        while (rootObj.parent && rootObj.parent !== sncGroup) {
          rootObj = rootObj.parent;
        }
        document.getElementById('title').innerText = rootObj.userData.name || "Estructura del SNC";
        document.getElementById('desc').innerText = rootObj.userData.desc || "";

        // Efecto visual sutil de interactividad
        sncGroup.children.forEach(c => c.scale.set(1,1,1));
        rootObj.scale.set(1.025, 1.025, 1.025);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
