<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Anatómica 3D: Sistema Nervioso Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 15px; right: 15px; width: 290px;
      background: rgba(10, 15, 25, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 16px; box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15);
      z-index: 10;
    }
    h3 { margin: 0 0 8px 0; color: #00f3ff; font-size: 1.15rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }
    .controls-hint {
      position: absolute; bottom: 15px; left: 15px;
      background: rgba(5, 8, 15, 0.75); backdrop-filter: blur(6px);
      padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 0.75rem; color: #94a3b8;
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central</h3>
    <p id="desc">Toca o haz clic sobre cualquier estructura anatómica (Cerebro, Cerebelo, Tallo o Médula) para explorar su fisiología clínica.</p>
  </div>

  <div class="controls-hint">
    Rotar: Tocar y arrastrar | Zoom: Pellizcar pantalla
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.03);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación Profesional Tipo Quirófano
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(6, 12, 8);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 1.0);
    rimLight.position.set(-8, 5, -6);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xff477e, 0.4);
    fillLight.position.set(0, -10, 4);
    scene.add(fillLight);

    const sncGroup = new THREE.Group();

    const createAnatomicMat = (colorHex) => new THREE.MeshPhysicalMaterial({
      color: colorHex,
      roughness: 0.3,
      metalness: 0.05,
      transmission: 0.25,
      transparent: true,
      opacity: 0.95,
      clearcoat: 1.0,
      clearcoatRoughness: 0.15,
      reflectivity: 0.8
    });

    // 1. CEREBRO ANATÓMICO (Hemisferios con hendidura central)
    const brainGeo = new THREE.SphereGeometry(1.35, 64, 64);
    brainGeo.scale(1.15, 0.92, 1.3);
    const posB = brainGeo.attributes.position;
    for (let i = 0; i < posB.count; i++) {
      let x = posB.getX(i), y = posB.getY(i), z = posB.getZ(i);
      if (Math.abs(x) < 0.25 && y > -0.2) {
        posB.setXYZ(i, x * 0.7, y, z);
      }
    }
    brainGeo.computeVertexNormals();
    const cerebrum = new THREE.Mesh(brainGeo, createAnatomicMat(0xff527b));
    cerebrum.position.set(0, 1.25, 0);
    cerebrum.userData = {
      name: "Cerebro (Hemisferios)",
      desc: "Estructura integradora superior. Procesa información sensorial, controla movimientos voluntarios, la memoria y el razonamiento."
    };
    sncGroup.add(cerebrum);

    // 2. CEREBELO ANATÓMICO (Bilobulado posterior)
    const cerebellumGeo = new THREE.SphereGeometry(0.62, 48, 48);
    cerebellumGeo.scale(1.45, 0.7, 0.95);
    const cerebellum = new THREE.Mesh(cerebellumGeo, createAnatomicMat(0xff9f43));
    cerebellum.position.set(0, 0.35, -0.85);
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Regula el equilibrio, la postura corporal y la coordinación fina de los movimientos."
    };
    sncGroup.add(cerebellum);

    // 3. TALLO CEREBRAL (Con protuberancia)
    const stemGeo = new THREE.CylinderGeometry(0.35, 0.22, 1.25, 32);
    const brainStem = new THREE.Mesh(stemGeo, createAnatomicMat(0x00d2d3));
    brainStem.position.set(0, 0.2, -0.15);
    brainStem.rotation.x = 0.08;
    brainStem.userData = {
      name: "Tallo Cerebral",
      desc: "Conecta el encéfalo con la médula. Controla funciones vitales automáticas como la respiración y el ritmo cardíaco."
    };
    sncGroup.add(brainStem);

    // 4. MÉDULA ESPINAL
    const cordGeo = new THREE.CylinderGeometry(0.16, 0.1
