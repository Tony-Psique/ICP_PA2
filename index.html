<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Anatómica 3D: Sistema Nervioso Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 15px; right: 15px; width: 290px;
      background: rgba(10, 15, 25, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 16px; box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15);
      z-index: 10;
    }
    h3 { margin: 0 0 8px 0; color: #00f3ff; font-size: 1.15rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }
    .controls-hint {
      position: absolute; bottom: 15px; left: 15px;
      background: rgba(5, 8, 15, 0.75); backdrop-filter: blur(6px);
      padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 0.75rem; color: #94a3b8;
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central</h3>
    <p id="desc">Toca o haz clic sobre cualquier estructura anatómica (Cerebro, Cerebelo, Tallo o Médula) para explorar su fisiología clínica.</p>
  </div>

  <div class="controls-hint">
    Rotar: Tocar y arrastrar | Zoom: Pellizcar pantalla
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.03);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación clínica avanzada
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(6, 12, 8);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 1.0);
    rimLight.position.set(-8, 5, -6);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xff477e, 0.4);
    fillLight.position.set(0, -10, 4);
    scene.add(fillLight);

    // Grupo principal del SNC
    const sncGroup = new THREE.Group();

    const createAnatomicMat = (colorHex) => new THREE.MeshPhysicalMaterial({
      color: colorHex,
      roughness: 0.25,
      metalness: 0.05,
      transmission: 0.3,
      transparent: true,
      opacity: 0.95,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      reflectivity: 0.9
    });

    // 1. CEREBRO ANATÓMICO MULTILOBULAR (Composición orgánica de lóbulos)
    const brainGroup = new THREE.Group();
    const brainMat = createAnatomicMat(0xff477e);

    // Lóbulo Frontal (Voluminoso y anterior)
    const frontalGeo = new THREE.SphereGeometry(0.9, 32, 32);
    frontalGeo.scale(1.2, 0.9, 1.1);
    const frontalMesh = new THREE.Mesh(frontalGeo, brainMat);
    frontalMesh.position.set(0, 0.1, 0.35);
    brainGroup.add(frontalMesh);

    // Lóbulos Parietal y Occipital (Posteriores y superiores)
    const backGeo = new THREE.SphereGeometry(0.95, 32, 32);
    backGeo.scale(1.15, 0.95, 1.1);
    const backMesh = new THREE.Mesh(backGeo, brainMat);
    backMesh.position.set(0, 0.15, -0.35);
    brainGroup.add(backMesh);

    // Lóbulos Temporales (Laterales izquierdo y derecho)
    const temporalGeo = new THREE.SphereGeometry(0.65, 32, 32);
    temporalGeo.scale(0.8, 0.6, 1.1);
    
    const tempLeft = new THREE.Mesh(temporalGeo, brainMat);
    tempLeft.position.set(0.75, -0.2, 0.05);
    tempLeft.rotation.z = -0.15;
    brainGroup.add(tempLeft);

    const tempRight = new THREE.Mesh(temporalGeo, brainMat);
    tempRight.position.set(-0.75, -0.2, 0.05);
    tempRight.rotation.z = 0.15;
    brainGroup.add(tempRight);

    brainGroup.position.set(0, 1.2, 0);
    brainGroup.userData = {
      name: "Cerebro (Hemisferios y Lóbulos)",
      desc: "Centro integrador superior. Estructura multilobular que gestiona la cognición, el procesamiento sensorial, el lenguaje y la motricidad voluntaria."
    };
    sncGroup.add(brainGroup);

    // 2. CEREBELO ANATÓMICO (Bilobulado con folias horizontales simuladas)
    const cerebellumGeo = new THREE.SphereGeometry(0.58, 32, 32);
    cerebellumGeo.scale(1.4, 0.65, 0.85);
    const cerebellum = new THREE.Mesh(cerebellumGeo, createAnatomicMat(0xff9f43));
    cerebellum.position.set(0, 0.4, -0.85);
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Ubicado en la fosa posterior. Integra vías sensitivas y motoras para coordinar la postura, el equilibrio y la precisión de los movimientos finos."
    };
    sncGroup.add(cerebellum);

    // 3. TALLO CEREBRAL (Tronco encefálico con protuberancia anular)
    const stemGeo = new THREE.CylinderGeometry(0.3, 0.22, 1.2, 32);
    const brainStem = new THREE.Mesh(stemGeo, createAnatomicMat(0x00d2d3));
    brainStem.position.set(0, 0.2, -0.15);
    brainStem.rotation.x = 0.1;
    brainStem.userData = {
      name: "Tallo Cerebral (Tronco Encefálico)",
      desc: "Compuesto por mesencéfalo, puente y bulbo raquídeo. Conecta el encéfalo con la médula y regula funciones autónomas vitales (respiración y ritmo cardíaco)."
    };
    sncGroup.add(brainStem);

    // 4. MÉDULA ESPINAL
    const cordGeo = new THREE.CylinderGeometry(0.14, 0.11, 3.8, 32);
    const spinalCord = new THREE.Mesh(cordGeo, createAnatomicMat(0x10ac84));
    spinalCord.position.set(0, -1.85, -0.25);
    spinalCord.userData = {
      name: "Médula Espinal",
      desc: "Vía de conducción nerviosa central. Transmite impulsos sensitivos hacia el cerebro y respuestas motoras hacia el resto del cuerpo."
    };
    sncGroup.add(spinalCord);

    scene.add(sncGroup);

    // Sistema de interacción táctil
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sncGroup.children, true);

      if (intersects.length > 0) {
        let rootObj = intersects[0].object;
        while (rootObj.parent && rootObj.parent !== sncGroup) {
          rootObj = rootObj.parent;
        }
        
        // Determinar nombre y descripción según el objeto seleccionado
        let name = "Estructura del SNC";
        let desc = "Información anatómica y clínica detallada.";
        
        if (rootObj === brainGroup) {
          name = brainGroup.userData.name;
          desc = brainGroup.userData.desc;
        } else {
          name = rootObj.userData.name;
          desc = rootObj.userData.desc;
        }

        document.getElementById('title').innerText = name;
        document.getElementById('desc').innerText = desc;

        // Efecto visual de selección
        sncGroup.children.forEach(c => c.scale.set(1, 1, 1));
        rootObj.scale.set(1.06, 1.06, 1.06);
      }
    });

    window.addEventListener('resize', () => {
