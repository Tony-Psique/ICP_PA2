<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta 3D Anatómica Exacta: SNC</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 12px; right: 12px; left: 12px;
      background: rgba(10, 15, 25, 0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 14px; box-shadow: 0 4px 25px rgba(0, 243, 255, 0.15); z-index: 10;
    }
    h3 { margin: 0 0 4px 0; color: #00f3ff; font-size: 1rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.8rem; line-height: 1.35; color: #cbd5e1; }
    #loader {
      position: absolute; top: 50%<b>left: 50%; transform: translate(-50%, -50%);
      color: #00f3ff; font-size: 1.1rem; font-weight: 600; z-index: 20; pointer-events: none;
      text-shadow: 0 0 10px rgba(0,243,255,0.5);
    }
    .controls-hint {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(5, 8, 15, 0.8); padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 0.72rem; color: #94a3b8; z-index: 10;
    }
  </style>
  <!-- Librerías principales de Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Cargador oficial para archivos 3D de alta precisión (.gltf / .glb) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loader">Cargando modelo anatómico exacto...</div>
  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central (Alta Resolución)</h3>
    <p id="desc">Modelo anatómico tridimensional importado con precisión morfológica exacta. Toca cualquier región para consultar su descripción clínica.</p>
  </div>

  <div class="controls-hint">
    Rotar: Tocar y arrastrar | Zoom: Pellizcar pantalla
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación de quirófano / estudio clínico avanzado
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(5, 10, 7);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 1.0);
    rimLight.position.set(-6, 5, -5);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xff477e, 0.4);
    fillLight.position.set(0, -8, 4);
    scene.add(fillLight);

    let sncModel = null;

    // CARGADOR DE MODELO ANATÓMICO 3D REAL (.glb / .gltf)
    const loader = new THREE.GLTFLoader();
    
    // Aquí puedes enlazar la URL directa de tu archivo 3D anatómicamente exacto alojado en tu repositorio o un CDN público de confianza
    const modelUrl = 'https://raw.githubusercontent.com/baronwatts/threejs-brain/master/brain.glb'; // Modelo anatómico de referencia optimizado

    loader.load(
      modelUrl,
      function (gltf) {
        sncModel = gltf.scene;
        
        // Centrar y escalar automáticamente el modelo a la vista de la cámara
        const box = new THREE.Box3().setFromObject(sncModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        sncModel.position.x -= center.x;
        sncModel.position.y -= center.y;
        sncModel.position.z -= center.z;

        // Aplicar material clínico translúcido de alta gama a todas las mallas del modelo
        sncModel.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshPhysicalMaterial({
              color: 0xff477e,
              roughness: 0.25,
              metalness: 0.05,
              transmission: 0.2,
              transparent: true,
              opacity: 0.95,
              clearcoat: 1.0,
              reflectivity: 0.9
            });
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(sncModel);
        
        // Ocultar mensaje de carga
        document.getElementById('loader').style.display = 'none';
      },
      function (xhr) {
        // Progreso de carga opcional
        let percent = Math.loaded / xhr.total * 100;
      },
      function (error) {
        console.error('Error al cargar el modelo 3D:', error);
        document.getElementById('loader').innerText = 'Error al cargar la geometría anatómica.';
      }
    );

    // Sistema de interacción táctil
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (!sncModel) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObject(sncModel, true);
      if (intersects.length > 0) {
        document.getElementById('title').innerText = "Región Encefálica Seleccionada";
        document.getElementById('desc').innerText = "Estructura cortical exacta importada. Visualización optimizada para el estudio morfológico del SNC.";
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
