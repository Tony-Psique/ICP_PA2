<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta 3D: Sistema Nervioso Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 12px; right: 12px; left: 12px;
      background: rgba(10, 15, 25, 0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 14px; box-shadow: 0 4px 25px rgba(0, 243, 255, 0.15); z-index: 10;
    }
    h3 { margin: 0 0 4px 0; color: #00f3ff; font-size: 1rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.8rem; line-height: 1.35; color: #cbd5e1; }
    .controls-hint {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(5, 8, 15, 0.8); padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
      font-size: 0.72rem; color: #94a3b8; z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central (SNC)</h3>
    <p id="desc">Toca cualquier estructura anatómica para explorar su detalle clínico y fisiológico.</p>
  </div>

  <div class="controls-hint">
    Rotar: Tocar y arrastrar | Zoom: Pellizcar pantalla
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.4, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación clínica avanzada
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
    keyLight.position.set(5, 10, 7);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 1.0);
    rimLight.position.set(-6, 5, -5);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xff477e, 0.4);
    fillLight.position.set(0, -8, 4);
    scene.add(fillLight);

    const sncGroup = new THREE.Group();

    // Material translúcido clínico tipo PBR avanzado
    const createMat = (hex) => new THREE.MeshPhysicalMaterial({
      color: hex,
      roughness: 0.25,
      metalness: 0.05,
      transmission: 0.2,
      transparent: true,
      opacity: 0.95,
      clearcoat: 1.0,
      reflectivity: 0.9
    });

    // 1. CEREBRO ANATÓMICO (Hemisferios con pliegues corticales modelados)
    const brainGeo = new THREE.SphereGeometry(1.2, 48, 48);
    brainGeo.scale(1.15, 0.85, 1.3);
    
    const bPos = brainGeo.attributes.position;
    for (let i = 0; i < bPos.count; i++) {
      let x = bPos.getX(i), y = bPos.getY(i), z = bPos.getZ(i);
      if (Math.abs(x) < 0.25 && y > -0.2) x *= 0.4; // Fisura interhemisférica
      const folds = Math.sin(x * 15) * Math.cos(y * 15) * Math.sin(z * 15) * 0.035;
      bPos.setXYZ(i, x * (1 + folds), y * (1 + folds), z * (1 + folds));
    }
    brainGeo.computeVertexNormals();

    const cerebrum = new THREE.Mesh(brainGeo, createMat(0xff477e));
    cerebrum.position.set(0, 1.15, 0);
    cerebrum.userData = {
      name: "Cerebro (Hemisferios y Lóbulos)",
      desc: "Centro integrador superior. Gestiona funciones cognitivas, procesamiento sensorial, memoria y control motor voluntario."
    };
    sncGroup.add(cerebrum);

    // 2. CEREBELO
    const cbGeo = new THREE.SphereGeometry(0.58, 32, 32);
    cbGeo.scale(1.35, 0.6, 0.85);
    const cerebellum = new THREE.Mesh(cbGeo, createMat(0xff9f43));
    cerebellum.position.set(0, 0.3, -0.75);
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Ubicado en la fosa posterior. Regula el equilibrio, la postura corporal y la coordinación fina de los movimientos."
    };
    sncGroup.add(cerebellum);

    // 3. TALLO CEREBRAL
    const stemGroup = new THREE.Group();
    const pons = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), createMat(0x00d2d3));
    pons.scale.set(0.9, 0.7, 0.85);
    pons.position.set(0, 0.3, -0.12);
    
    const stemBody = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 1.1, 24), createMat(0x00d2d3));
    stemBody.position.set(0, 0.1, -0.18);
    stemBody.rotation.x = 0.08;
    
    stemGroup.add(pons, stemBody);
    stemGroup.userData = {
      name: "Tallo Cerebral",
      desc: "Conecta el encéfalo con la médula. Controla funciones autónomas vitales como la respiración y la frecuencia cardíaca."
    };
    sncGroup.add(stemGroup);

    // 4. MÉDULA ESPINAL
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 3.0, 24), createMat(0x10ac84));
    cord.position.set(0, -1.55, -0.22);
    cord.userData = {
      name: "Médula Espinal",
      desc: "Conduce los impulsos nerviosos entre el encéfalo y el resto del cuerpo."
    };
    sncGroup.add(cord);

    scene.add(sncGroup);

    // Interacción táctil
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      
      const intersects = raycaster.intersectObjects(sncGroup.children, true);
      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== sncGroup) { obj = obj.parent; }
        document.getElementById('title').innerText = obj.userData.name || "Estructura del SNC";
        document.getElementById('desc').innerText = obj.userData.desc || "";
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
