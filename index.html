<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Anatómica 3D: Sistema Nervioso Central</title>
  <style>
    body { margin: 0; overflow: hidden; background: #030508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; }
    #info-card {
      position: absolute; top: 15px; right: 15px; width: 290px;
      background: rgba(10, 15, 25, 0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 12px;
      padding: 16px; box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15);
      z-index: 10;
    }
    h3 { margin: 0 0 8px 0; color: #00f3ff; font-size: 1.15rem; letter-spacing: 0.5px; }
    p { margin: 0; font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; }
    .controls-hint {
      position: absolute; bottom: 15px; left: 15px;
      background: rgba(5, 8, 15, 0.75); backdrop-filter: blur(6px);
      padding: 8px 14px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 0.75rem; color: #94a3b8;
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="info-card">
    <h3 id="title">Sistema Nervioso Central</h3>
    <p id="desc">Toca cualquier estructura anatómica (Cerebro, Cerebelo, Tallo o Médula) para explorar su fisiología clínica.</p>
  </div>

  <div class="controls-hint">
    Rotar: Tocar y arrastrar | Zoom: Pellizcar pantalla
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.03);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.5, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación clínica
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(6, 12, 8);
    scene.add(mainLight);

    const rimLight = new THREE.DirectionalLight(0x00f3ff, 1.0);
    rimLight.position.set(-8, 5, -6);
    scene.add(rimLight);

    const sncGroup = new THREE.Group();

    const mat = (colorHex) => new THREE.MeshPhysicalMaterial({
      color: colorHex,
      roughness: 0.25,
      metalness: 0.05,
      transmission: 0.2,
      transparent: true,
      opacity: 0.95,
      clearcoat: 1.0,
      reflectivity: 0.8
    });

    // Cerebro orgánico compuesto (Hemisferios estilizados con alta suavidad)
    const brainGroup = new THREE.Group();
    const bMat = mat(0xff477e);

    const fGeom = new THREE.SphereGeometry(1.0, 32, 32); fGeom.scale(1.1, 0.85, 1.2);
    const frontal = new THREE.Mesh(fGeom, bMat); frontal.position.set(0, 0, 0.2);
    
    const tGeom = new THREE.SphereGeometry(0.65, 32, 32); tGeom.scale(0.8, 0.55, 1.0);
    const temporalL = new THREE.Mesh(tGeom, bMat); temporalL.position.set(0.7, -0.2, 0);
    const temporalR = new THREE.Mesh(tGeom, bMat); temporalR.position.set(-0.7, -0.2, 0);

    const oGeom = new THREE.SphereGeometry(0.75, 32, 32); oGeom.scale(1.0, 0.8, 0.9);
    const occipital = new THREE.Mesh(oGeom, bMat); occipital.position.set(0, 0.1, -0.5);

    brainGroup.add(frontal, temporalL, temporalR, occipital);
    brainGroup.position.set(0, 1.25, 0);
    brainGroup.userData = {
      name: "Cerebro (Hemisferios y Lóbulos)",
      desc: "Centro integrador superior. Gestiona funciones cognitivas, procesamiento sensorial, memoria y control motor voluntario."
    };
    sncGroup.add(brainGroup);

    // Cerebelo
    const cbGeom = new THREE.SphereGeometry(0.55, 32, 32); cbGeom.scale(1.3, 0.65, 0.8);
    const cerebellum = new THREE.Mesh(cbGeom, mat(0xff9f43));
    cerebellum.position.set(0, 0.4, -0.8);
    cerebellum.userData = {
      name: "Cerebelo",
      desc: "Regula el equilibrio, la postura corporal y la coordinación fina de los movimientos."
    };
    sncGroup.add(cerebellum);

    // Tallo Cerebral
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.2, 1.1, 32), mat(0x00d2d3));
    stem.position.set(0, 0.2, -0.15);
    stem.userData = {
      name: "Tallo Cerebral",
      desc: "Conecta el encéfalo con la médula. Controla funciones autónomas vitales como la respiración y la frecuencia cardíaca."
    };
    sncGroup.add(stem);

    // Médula Espinal
    const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.11, 3.5, 32), mat(0x10ac84));
    cord.position.set(0, -1.75, -0.25);
    cord.userData = {
      name: "Médula Espinal",
      desc: "Conduce impulsos sensitivos hacia el encéfalo y respuestas motoras hacia el resto del cuerpo."
    };
    sncGroup.add(cord);

    scene.add(sncGroup);

    // Interacción táctil
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sncGroup.children, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== sncGroup) { obj = obj.parent; }
        document.getElementById('title').innerText = obj.userData.name || "Sistema Nervioso Central";
        document.getElementById('desc').innerText = obj.userData.desc || "";
        sncGroup.children.forEach(c => c.scale.set(1, 1, 1));
        obj.scale.set(1.05, 1.05, 1.05);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
